name: Build and deploy portfolio

# Builds on every push to main or 3d-update.
# Only pushes to main publish the site (gh-pages -> riteshsingh.is-a.dev).
on:
  push:
    branches: [main, 3d-update]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check SEO and domain files survived the build
        run: |
          test -f dist/CNAME && grep -qx 'riteshsingh.is-a.dev' dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/a22aab7b988a3783ebbf5359398b95ea.txt
          grep -q 'https://riteshsingh.is-a.dev/' dist/index.html
          grep -q '"@type": "Person"' dist/index.html
          grep -q 'seo-snap' dist/index.html
          grep -q '"@type":"WebSite"\|"@type": "WebSite"' dist/index.html
          test -f dist/google5e0b10acc3991084.html
          for f in favicon.ico favicon.svg favicon-48x48.png favicon-192x192.png apple-touch-icon.png; do test -f "dist/$f"; done
          grep -q 'rel="icon"' dist/index.html
          echo "All SEO, domain and favicon files present."

      - name: Publish preview build (3d-update only, not live)
        if: github.ref == 'refs/heads/3d-update'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: preview-3d

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: riteshsingh.is-a.dev
